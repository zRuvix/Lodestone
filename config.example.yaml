# Lodestone example config. Copy to config.yaml and adjust.
# Minecraft target version: 1.21.1 (Java Edition).

llm:
  base_url: "https://9r.ai-api.bond/"   # base URL or full .../v1/messages URL (normalized automatically)
  api_key_env: "LODESTONE_API_KEY"        # name of the env var holding the key (never put the key here)
  auth_type: "bearer"                     # "api_key" (x-api-key) or "bearer" (Authorization: Bearer)
  model: "oc/muse-spark-1.3-contributor-free"
  max_tokens: 2048
  temperature: null                        # null = don't send the parameter
  stream: true
  prompt_caching: false                    # only enable if the endpoint supports cache_control
  extra_headers: {}                        # optional, for gateways that need them
  request_timeout_seconds: 120
  max_retries: 2

minecraft:
  host: "localhost"
  port: 25565
  version: "1.21.1"
  username: "Agent"
  auth: "offline"            # "offline" or "microsoft"
  connect_timeout_seconds: 30
  auto_reconnect: false

agent:
  max_turns: 40
  system_prompt_file: "prompts/system.md"
  allowed_tools: [observe, goto, collect_block, say]
  parallel_read_only_tools: false
  keep_last_observations: 3

observation:
  radius: 16
  max_entities: 10
  max_block_types: 12
  include_inventory: true

tools:
  default_timeout_seconds: 60
  goto:
    arrive_distance: 1
    timeout_seconds: 90
  collect_block:
    search_radius: 32
    max_count: 64
    timeout_seconds: 120

pathfinder:
  can_dig: true
  allow_sprinting: true
  allow_parkour: false
  max_drop_down: 3
  allow_1by1_towers: false

logging:
  level: "info"
  show_reasoning: true
  log_file: null
